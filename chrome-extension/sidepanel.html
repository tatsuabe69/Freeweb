<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anything</title>
  <style>
    :root {
      --bg: #fafafa;
      --card: #ffffff;
      --border: #e5e7eb;
      --text: #18181b;
      --text-muted: #71717a;
      --primary: #6366f1;
      --primary-light: #eef2ff;
      --radius: 10px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090b;
        --card: #18181b;
        --border: #27272a;
        --text: #fafafa;
        --text-muted: #a1a1aa;
        --primary: #818cf8;
        --primary-light: #1e1b4b;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--card);
      flex-shrink: 0;
    }
    .header-title {
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header-title svg { width: 16px; height: 16px; color: var(--primary); }
    .back-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      font-size: 13px;
      align-items: center;
      gap: 4px;
    }
    .back-btn:hover { color: var(--text); background: var(--primary-light); }
    .back-btn.visible { display: inline-flex; }

    /* Category tabs */
    .tabs {
      display: flex;
      gap: 4px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--card);
      overflow-x: auto;
      flex-shrink: 0;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      padding: 5px 10px;
      border-radius: 20px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .tab:hover { background: var(--primary-light); color: var(--text); }
    .tab.active { background: var(--primary); color: #fff; }

    /* Tool list */
    .tool-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .tool-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: var(--radius);
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s;
    }
    .tool-item:hover { background: var(--card); border-color: var(--border); }
    .tool-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 16px;
    }
    .tool-info { min-width: 0; }
    .tool-title { font-size: 13px; font-weight: 600; }
    .tool-desc {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* iframe view */
    .iframe-wrap {
      flex: 1;
      display: none;
      overflow: hidden;
    }
    .iframe-wrap.visible { display: flex; }
    .iframe-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Setup banner */
    .setup-banner {
      display: none;
      padding: 12px;
      margin: 8px;
      border-radius: var(--radius);
      background: #fef3c7;
      border: 1px solid #fcd34d;
      font-size: 12px;
      color: #92400e;
      flex-direction: column;
      gap: 8px;
    }
    .setup-banner.visible { display: flex; }
    .setup-banner a {
      color: var(--primary);
      text-decoration: underline;
      cursor: pointer;
    }
    @media (prefers-color-scheme: dark) {
      .setup-banner {
        background: #422006;
        border-color: #92400e;
        color: #fcd34d;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <button class="back-btn" id="backBtn" onclick="showHome()">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      戻る
    </button>
    <span class="header-title">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>
      Anything
    </span>
    <span style="width: 48px"></span>
  </div>

  <div id="homeView">
    <div class="setup-banner" id="setupBanner">
      ⚠️ アプリのURLが未設定です。<br>
      <a id="openOptions">設定を開いてURLを入力 →</a>
    </div>

    <div class="tabs" id="tabs"></div>
    <div class="tool-list" id="toolList"></div>
  </div>

  <div class="iframe-wrap" id="iframeWrap">
    <iframe id="appFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox" allow="clipboard-write"></iframe>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
